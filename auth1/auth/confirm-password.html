<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تأیید رمز عبور</title>
    <link rel="stylesheet" href="../assets/libraries/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../assets/css/auth/core.css">
    <link rel="stylesheet" href="../assets/css/auth/confirm-password.css">
</head>

<body style="background-color: #F0F0F0;">
    <main class="app p-3">
        <div>
            <h1 class="fw-bold fs-4">تأیید رمز عبور</h1>
            <p class="text-secondary small mt-3">برای ادامه عملیات، لطفاً رمز عبور خود را وارد کنید.</p>
        </div>

        <form action="#" method="post" novalidate class="d-flex flex-column gap-3 mt-4">
            <div class="d-flex flex-column">
                <label for="password" class="form-label text-secondary small">رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="********" required autofocus>
            </div>
           <div class="d-flex flex-column gap-2 mt-2">
                <button type="submit" class="btn btn-primary rounded rounded-3" style="padding:12px 0px;">تأیید</button>
                <a href="login.html" class="btn btn-outline-primary" style="padding:12px 0px">انصراف</a>
            </div>
        </form>
    </main>
</body>

</html>
