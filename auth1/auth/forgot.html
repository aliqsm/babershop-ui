<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>فراموشی رمز عبور</title>
    <link rel="stylesheet" href="../assets/libraries/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="../assets/css/auth/core.css">
    <link rel="stylesheet" href="../assets/css/auth/forget.css">
</head>

<body style="background-color: #F0F0F0;">
    <main class="app p-3">
        <div>
            <h1 class="fw-bold fs-4">فراموشی رمز عبور</h1>
            <p class="text-secondary small mt-3">ایمیل خود را وارد کنید تا لینک بازیابی برایتان ارسال شود.</p>
        </div>

        <form action="#" method="post" novalidate class="d-flex flex-column gap-3 mt-4">
                        <div class="d-flex flex-column">
                <label for="email" class="form-label text-secondary small">ایمیل</label>
                <input id="email" name="email" type="email" placeholder="example@domain.com" required autocomplete="email">
            </div>
            <div class="d-flex flex-column gap-2 mt-2">
                <button  type="submit" class="btn btn-primary rounded rounded-3" style="padding: 12px 0px;">ارسال لینک بازیابی</button>
                <a href="login.html" class="btn btn-outline-primary" style="padding:12px 0px">بازگشت به ورود</a>
            </div>
        </form>
    </main>
</body>

</html>
