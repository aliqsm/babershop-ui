<!doctype html>
<html lang="fa" dir="rtl">

<body>
    <div class="main-container">
        <form action="" method="post" class="mx-auto w-100 px-3">
            <img src="../assets/images/auth/logo.png" alt="" class="d-block m-auto">
            <h3 class="fw-bold mt-5 fs-5">به پنل کاربری خوش آمدید.</h3>
            <p class="text-secondary small my-4">برای ورود / ثبت نام شماره موبایل خود را تایید کنید</p>

            <label class="form-label mb-3 small text-secondary">کد تایید</label>
            <div class="d-flex align-items-center justify-content-center gap-2" dir="ltr">
                <input type="tel" name="otp" class="w-100 text-center rounded rounded-4 border border-secondary-subtle" maxlength="1" inputmode="numeric" pattern="[0-9]*" autofocus>
                <input type="tel" name="otp" class="w-100 text-center rounded rounded-4 border border-secondary-subtle" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" name="otp" class="w-100 text-center rounded rounded-4 border border-secondary-subtle" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" name="otp" class="w-100 text-center rounded rounded-4 border border-secondary-subtle" maxlength="1" inputmode="numeric" pattern="[0-9]*">
                <input type="tel" name="otp" class="w-100 text-center rounded rounded-4 border border-secondary-subtle" maxlength="1" inputmode="numeric" pattern="[0-9]*">
            </div>

            <div class="d-flex align-items-center justify-content-between mt-4">
                <span class="small text-dark" style="font-size: 0.85rem;">کد به شماره 9038901236 ارسال شد.</span>
                <a href="login.html" style="color: #58bddb; font-size: 0.81rem; text-decoration: none;">تغییر شماره
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.5 4.16663L7.5 9.99996L12.5 15.8333" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"></path>
                    </svg>
                </a>
            </div>

            <p class="text-center small text-secondary mt-4 mb-3"><span id="timer">2:00</span> ثانیه مانده تا ارسال مجدد کد تایید</p>
            <a href="../home.html" class="btn w-100 fw-bold rounded rounded-4 mt-3">تایید</a>
            <p class="text-secondary text-center mt-4" style="font-size: 0.8rem;line-height: 1.5rem;">با ورود یا ثبت‌نام در این وبسایت، شما به طور خودکار تمام <a href="#">قوانین و
                    مقررات</a>
                استفاده از سایت را قبول می‌کنید.</p>
