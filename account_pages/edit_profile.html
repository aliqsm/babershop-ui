                <h3 class="small fw-bold mt-2">علی قاسمی</h3>

            <!-- Edit-Form Begin -->
            <form class="account-edit-form mt-4">
                <h5 class="mb-3 fw-bold fs-5">اطلاعات حساب</h5>

                <div class="mb-3">
                    <label for="firstName" class="form-label small">نام:</label>
                    <input type="text" id="firstName" value="علی" class="form-control rounded-pill" placeholder="نام شما">
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label small">نام خانوادگی:</label>
                    <input type="text" id="lastName" value="قاسمی" class="form-control rounded-pill" placeholder="نام خانوادگی شما">
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label small">شماره تلفن:</label>
                    <input type="tel" id="phone" value="09038901908" class="form-control rounded-pill" placeholder="09123456789" pattern="[0-9]*" maxlength="11">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label small">ایمیل:</label>
                    <input type="email" id="email" class="form-control rounded-pill" placeholder="example@email.com">
                </div>

                <button type="submit" class="btn w-100 rounded-pill p-3 text-light fw-bold mt-3 small" style="background-color: var(--color-primary);">ذخیره</button>
            </form>
            <!-- Edit-Form End -->
